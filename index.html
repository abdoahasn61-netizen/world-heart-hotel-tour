<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فندق قلب العالم - الجولة الافتراضية 360° | World Heart Hotel</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Pannellum 360 Library -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-gold: #c5a059;
            --primary-dark: #0f172a;
            --overlay-dark: rgba(15, 23, 42, 0.75);
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--primary-dark);
            color: var(--white);
        }

        /* --- Header / Logo Section --- */
        .top-header {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-container {
            background-color: #ffffff;
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--primary-gold);
            transition: transform 0.3s ease;
        }

        .logo-container:hover {
            transform: scale(1.03);
        }

        .logo-container img {
            height: 48px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .hotel-name-badge {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(197, 160, 89, 0.4);
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--primary-gold);
            letter-spacing: 0.5px;
        }

        /* --- Landing Screen --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 900;
            background-image: linear-gradient(var(--overlay-dark), var(--overlay-dark)), url('FB_IMG_1789953128146.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .welcome-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 40px 30px;
            border-radius: 24px;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 1s ease;
        }

        .welcome-card h1 {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .welcome-card h1 span {
            color: var(--primary-gold);
            display: block;
            font-size: 1.8rem;
            margin-top: 5px;
        }

        .welcome-card p {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-start {
            background: linear-gradient(135deg, #c5a059 0%, #9a7b3e 100%);
            color: #ffffff;
            border: none;
            padding: 16px 42px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(197, 160, 89, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(197, 160, 89, 0.6);
            background: linear-gradient(135deg, #d4af66 0%, #a88746 100%);
        }

        .btn-start i {
            transition: transform 0.3s ease;
        }

        .btn-start:hover i {
            transform: translateX(-5px);
        }

        /* --- 360 Viewer Container --- */
        #panorama-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- Scene Navigation Bar --- */
        .scene-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 800;
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 18px;
            border-radius: 40px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            max-width: 92vw;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .scene-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scene-btn:hover, .scene-btn.active {
            background: var(--primary-gold);
            color: #ffffff;
            border-color: var(--primary-gold);
            box-shadow: 0 4px 12px rgba(197, 160, 89, 0.3);
        }

        /* Home Button */
        .btn-home-screen {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(197, 160, 89, 0.4);
            color: var(--primary-gold);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-home-screen:hover {
            background: var(--primary-gold);
            color: #ffffff;
            transform: scale(1.08);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .welcome-card h1 {
                font-size: 1.8rem;
            }
            .welcome-card h1 span {
                font-size: 1.3rem;
            }
            .logo-container img {
                height: 38px;
            }
            .hotel-name-badge {
                display: none;
            }
            .top-header {
                top: 15px;
                right: 15px;
            }
            .btn-home-screen {
                top: 15px;
                left: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Logo Bar -->
    <div class="top-header">
        <div class="logo-container">
            <img src="logo.png" alt="شعار فندق قلب العالم" onerror="this.style.display='none'; this.parentNode.innerText='شعار الفندق';">
        </div>
        <div class="hotel-name-badge">
            <i class="fa-solid fa-hotel"></i> فندق قلب العالم
        </div>
    </div>

    <!-- Return to Welcome Screen Button -->
    <button class="btn-home-screen" onclick="showWelcomeScreen()" title="الرجوع للرئيسية">
        <i class="fa-solid fa-house"></i>
    </button>

    <!-- Welcome Screen -->
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1>أهلاً بكم في <span>فندق قلب العالم</span></h1>
            <p>استكشف الفخامة والأناقة في تفاصيل الفندق من خلال جولة افتراضية تفاعلية بتقنية 360 درجة.</p>
            <button class="btn-start" onclick="startTour()">
                <span>ابدأ الجولة الافتراضية</span>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <!-- 360 Panorama Viewer Area -->
    <div id="panorama-container"></div>

    <!-- Scene Navigation -->
    <div class="scene-nav">
        <button class="scene-btn active" onclick="loadScene('entrance', this)">
            <i class="fa-solid fa-door-open"></i> المدخل الرئيسي
        </button>
        <button class="scene-btn" onclick="loadScene('lobby', this)">
            <i class="fa-solid fa-couch"></i> اللوبي والاستقبال
        </button>
        <button class="scene-btn" onclick="loadScene('suite', this)">
            <i class="fa-solid fa-bed"></i> الأجنحة الفاخرة
        </button>
        <button class="scene-btn" onclick="loadScene('restaurant', this)">
            <i class="fa-solid fa-utensils"></i> المطعم الرئيسي
        </button>
    </div>

    <script>
        let viewer;

        window.addEventListener('load', function() {
            viewer = pannellum.viewer('panorama-container', {
                "default": {
                    "firstScene": "entrance",
                    "author": "فندق قلب العالم",
                    "sceneFadeDuration": 1000,
                    "autoLoad": true,
                    "autoRotate": -2,
                    "compass": false,
                    "showZoomCtrl": false
                },
                "scenes": {
                    "entrance": {
                        "title": "المدخل الرئيسي - فندق قلب العالم",
                        "type": "equirectangular",
                        "panorama": "FB_IMG_1789953128146.jpg"
                    },
                    "lobby": {
                        "title": "البهو والاستقبال",
                        "type": "equirectangular",
                        "panorama": "FB_IMG_1789953128146.jpg"
                    },
                    "suite": {
                        "title": "الجناح الملكي",
                        "type": "equirectangular",
                        "panorama": "FB_IMG_1789953128146.jpg"
                    },
                    "restaurant": {
                        "title": "المطعم الأنيق",
                        "type": "equirectangular",
                        "panorama": "FB_IMG_1789953128146.jpg"
                    }
                }
            });
        });

        function startTour() {
            document.getElementById('welcome-screen').classList.add('hidden');
        }

        function showWelcomeScreen() {
            document.getElementById('welcome-screen').classList.remove('hidden');
        }

        function loadScene(sceneId, btnElement) {
            if (viewer) {
                viewer.loadScene(sceneId);
            }
            let buttons = document.querySelectorAll('.scene-btn');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
            });
            if (btnElement) {
                btnElement.classList.add('active');
            }
            document.getElementById('welcome-screen').classList.add('hidden');
        }
    </script>
</body>
</html>
