                <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Heart Hotel - Virtual Tour</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Pannellum 360 Library -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-gold: #c5a059;
            --primary-dark: #1e293b;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-light);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            max-width: 550px;
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px 0 20px;
            margin: 0 auto;
        }

        .lang-btn {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--primary-dark);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            user-select: none;
        }

        /* Container */
        .app-container {
            max-width: 550px;
            margin: 0 auto;
            padding: 15px 20px 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* Header Section */
        .header-section {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .logo-wrapper {
            width: 120px;
            height: 120px;
            background-color: #ffffff;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 3px solid var(--primary-gold);
            overflow: hidden;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stars {
            color: var(--primary-gold);
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .hotel-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .hotel-subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* Menu List */
        .menu-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-card {
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            cursor: pointer;
            text-align: inherit;
            color: inherit;
            outline: none;
            transition: border-color 0.2s, transform 0.1s;
        }

        .menu-card:active {
            transform: scale(0.98);
            border-color: var(--primary-gold);
        }

        .card-content {
            display: flex;
            align-items: center;
            gap: 16px;
            pointer-events: none;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background-color: #faf5ed;
            color: var(--primary-gold);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .card-text {
            display: flex;
            flex-direction: column;
        }

        .card-text h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .card-text p {
            font-size: 0.82rem;
            color: var(--text-sub);
        }

        .card-arrow {
            color: #94a3b8;
            font-size: 0.9rem;
            pointer-events: none;
        }

        html[dir="ltr"] .card-arrow {
            transform: rotate(180deg);
        }

        /* Overlay Viewer */
        #tour-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 99999;
            display: none;
        }

        #panorama-view {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fallback-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .btn-back {
            position: absolute;
            top: 20px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        html[dir="ltr"] .btn-back { left: 20px; }
        html[dir="rtl"] .btn-back { right: 20px; }

        .scene-nav {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid rgba(197, 160, 89, 0.4);
            max-width: 94vw;
            overflow-x: auto;
            white-space: nowrap;
        }

        .scene-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scene-btn.active {
            background: var(--primary-gold);
            color: #ffffff;
            border-color: var(--primary-gold);
        }
    </style>
</head>
<body>

    <!-- Language Switcher Bar -->
    <div class="top-bar">
        <button type="button" class="lang-btn" onclick="toggleLanguage()">
            <i class="fa-solid fa-globe"></i>
            <span id="lang-btn-text">English</span>
        </button>
    </div>

    <!-- Main Interface Container -->
    <div class="app-container">
        <div class="header-section">
            <div class="logo-wrapper">
                <img src="logo.png" alt="World Heart Hotel" onerror="this.onerror=null; this.src='FB_IMG_1789953128146.jpg';">
            </div>
            <div class="stars">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
            </div>
            <h1 class="hotel-title" id="txt-title">فندق قلب العالم</h1>
            <p class="hotel-subtitle" id="txt-subtitle">حدد القسم المطلوب لبدء الجولة التفاعلية 360°</p>
        </div>

        <!-- Category Menu List -->
        <div class="menu-list">
            <button type="button" class="menu-card" onclick="openTour('suite')">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-bed"></i></div>
                    <div class="card-text">
                        <h3 id="txt-suite-title">الغرف والأجنحة الفاخرة</h3>
                        <p id="txt-suite-desc">استعراض جناح السفير والغرف الملكية</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left card-arrow"></i>
            </button>

            <button type="button" class="menu-card" onclick="openTour('halls')">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-handshake"></i></div>
                    <div class="card-text">
                        <h3 id="txt-halls-title">قاعات الاجتماعات والفعاليات</h3>
                        <p id="txt-halls-desc">قاعات مؤتمرات مجهزة بأحدث التقنيات</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left card-arrow"></i>
            </button>

            <button type="button" class="menu-card" onclick="openTour('restaurant')">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-utensils"></i></div>
                    <div class="card-text">
                        <h3 id="txt-rest-title">المطاعم والجلسات (AZZURRO)</h3>
                        <p id="txt-rest-desc">استكشف مطعم أزور والمطاعم المتميزة</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left card-arrow"></i>
            </button>

            <button type="button" class="menu-card" onclick="openTour('gym')">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-dumbbell"></i></div>
                    <div class="card-text">
                        <h3 id="txt-gym-title">المركز الرياضي والسبا</h3>
                        <p id="txt-gym-desc">أجهزة لياقة بدنية وحديثة مع السبا</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left card-arrow"></i>
            </button>

            <button type="button" class="menu-card" onclick="openTour('lobby')">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-hotel"></i></div>
                    <div class="card-text">
                        <h3 id="txt-lobby-title">المدخل الرئيسي واللوبي</h3>
                        <p id="txt-lobby-desc">الواجهة الخارجية والاستقبال الملكي</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left card-arrow"></i>
            </button>
        </div>
    </div>

    <!-- Overlay Viewer -->
    <div id="tour-overlay">
        <button type="button" class="btn-back" onclick="closeTour()">
            <i class="fa-solid fa-arrow-right" id="back-icon"></i> <span id="txt-back">العودة للقائمة</span>
        </button>

        <div id="panorama-view"></div>

        <div class="scene-nav">
            <button type="button" class="scene-btn" id="nav-btn-suite" onclick="switchScene('suite')">
                <i class="fa-solid fa-bed"></i> <span id="nav-suite">الغرف والأجنحة</span>
            </button>

            <button type="button" class="scene-btn" id="nav-btn-halls" onclick="switchScene('halls')">
                <i class="fa-solid fa-handshake"></i> <span id="nav-halls">قاعات الفعاليات</span>
            </button>

            <button type="button" class="scene-btn" id="nav-btn-restaurant" onclick="switchScene('restaurant')">
                <i class="fa-solid fa-utensils"></i> <span id="nav-restaurant">المطاعم</span>
            </button>

            <button type="button" class="scene-btn" id="nav-btn-gym" onclick="switchScene('gym')">
                <i class="fa-solid fa-dumbbell"></i> <span id="nav-gym">المركز الرياضي</span>
            </button>

            <button type="button" class="scene-btn" id="nav-btn-lobby" onclick="switchScene('lobby')">
                <i class="fa-solid fa-hotel"></i> <span id="nav-lobby">المدخل واللوبي</span>
            </button>
        </div>
    </div>

    <script>
        var viewer = null;
        var currentLang = 'ar';
        var activeSceneKey = 'lobby';

        var i18n = {
            ar: {
                langBtnText: "English",
                title: "فندق قلب العالم",
                subtitle: "حدد القسم المطلوب لبدء الجولة التفاعلية 360°",
                backBtn: "العودة للقائمة",
                suiteTitle: "الغرف والأجنحة الفاخرة",
                suiteDesc: "استعراض جناح السفير والغرف الملكية",
                hallsTitle: "قاعات الاجتماعات والفعاليات",
                hallsDesc: "قاعات مؤتمرات مجهزة بأحدث التقنيات",
                restTitle: "المطاعم والجلسات (AZZURRO)",
                restDesc: "استكشف مطعم أزور والمطاعم المتميزة",
                gymTitle: "المركز الرياضي والسبا",
                gymDesc: "أجهزة لياقة بدنية وحديثة مع السبا",
                lobbyTitle: "المدخل الرئيسي واللوبي",
                lobbyDesc: "الواجهة الخارجية والاستقبال الملكي",
                navSuite: "الغرف والأجنحة",
                navHalls: "قاعات الفعاليات",
                navRest: "المطاعم",
                navGym: "المركز الرياضي",
                navLobby: "المدخل واللوبي",
                scenes: {
                    suite: "الغرف والأجنحة الفاخرة",
                    halls: "قاعات الاجتماعات والفعاليات",
                    restaurant: "المطاعم والجلسات (AZZURRO)",
                    gym: "المركز الرياضي والسبا",
                    lobby: "المدخل الرئيسي واللوبي"
                }
            },
            en: {
                langBtnText: "العربية",
                title: "World Heart Hotel",
                subtitle: "Select a department to start the interactive 360° tour",
                backBtn: "Back to Menu",
                suiteTitle: "Luxury Rooms & Suites",
                suiteDesc: "Explore the Ambassador Suite & Royal Rooms",
                hallsTitle: "Meeting & Event Halls",
                hallsDesc: "Conference halls equipped with latest technology",
                restTitle: "Restaurants & Dining (AZZURRO)",
                restDesc: "Discover Azzurro Restaurant & fine dining",
                gymTitle: "Fitness Center & Spa",
                gymDesc: "Modern fitness equipment with spa facilities",
                lobbyTitle: "Main Entrance & Lobby",
                lobbyDesc: "Exterior view & royal reception area",
                navSuite: "Rooms & Suites",
                navHalls: "Event Halls",
                navRest: "Restaurants",
                navGym: "Fitness Center",
                navLobby: "Lobby",
                scenes: {
                    suite: "Luxury Rooms & Suites",
                    halls: "Meeting & Event Halls",
                    restaurant: "Restaurants & Dining (AZZURRO)",
                    gym: "Fitness Center & Spa",
                    lobby: "Main Entrance & Lobby"
                }
            }
        };

        var sceneImages = {
            'suite': 'FB_IMG_1789953128146.jpg',
            'halls': 'FB_IMG_1789953128146.jpg',
            'restaurant': 'FB_IMG_1789953128146.jpg',
            'gym': 'FB_IMG_1789953128146.jpg',
            'lobby': 'FB_IMG_1789953128146.jpg'
        };

        function toggleLanguage() {
            currentLang = (currentLang === 'ar') ? 'en' : 'ar';
            applyLanguage();
        }

        function applyLanguage() {
            var data = i18n[currentLang];
            var htmlTag = document.documentElement;

            htmlTag.setAttribute('lang', currentLang);
            htmlTag.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');

            document.getElementById('lang-btn-text').innerText = data.langBtnText;
            document.getElementById('txt-title').innerText = data.title;
            document.getElementById('txt-subtitle').innerText = data.subtitle;

            document.getElementById('txt-suite-title').innerText = data.suiteTitle;
            document.getElementById('txt-suite-desc').innerText = data.suiteDesc;

            document.getElementById('txt-halls-title').innerText = data.hallsTitle;
            document.getElementById('txt-halls-desc').innerText = data.hallsDesc;

            document.getElementById('txt-rest-title').innerText = data.restTitle;
            document.getElementById('txt-rest-desc').innerText = data.restDesc;

            document.getElementById('txt-gym-title').innerText = data.gymTitle;
            document.getElementById('txt-gym-desc').innerText = data.gymDesc;

            document.getElementById('txt-lobby-title').innerText = data.lobbyTitle;
            document.getElementById('txt-lobby-desc').innerText = data.lobbyDesc;

            document.getElementById('txt-back').innerText = data.backBtn;
            document.getElementById('back-icon').className = currentLang === 'ar' ? 'fa-solid fa-arrow-right' : 'fa-solid fa-arrow-left';

            document.getElementById('nav-suite').innerText = data.navSuite;
            document.getElementById('nav-halls').innerText = data.navHalls;
            document.getElementById('nav-restaurant').innerText = data.navRest;
            document.getElementById('nav-gym').innerText = data.navGym;
            document.getElementById('nav-lobby').innerText = data.navLobby;
        }

        function openTour(sceneKey) {
            document.getElementById('tour-overlay').style.display = 'block';
            switchScene(sceneKey);
        }

        function switchScene(sceneKey) {
            activeSceneKey = sceneKey;
            var sceneTitle = i18n[currentLang].scenes[sceneKey] || '';
            var sceneImage = sceneImages[sceneKey] || sceneImages['lobby'];

            var navBtns = document.querySelectorAll('.scene-btn');
            navBtns.forEach(function(btn) { btn.classList.remove('active'); });
            
            var targetBtn = document.getElementById('nav-btn-' + sceneKey);
            if (targetBtn) targetBtn.classList.add('active');

            if (viewer) {
                try { viewer.destroy(); } catch (e) {}
                viewer = null;
            }

            var container = document.getElementById('panorama-view');
            container.innerHTML = '';

            // محاولة العرض عبر Pannellum مع العرض الاحتياطي المباشر عند تعذر التشغيل
            if (typeof pannellum !== 'undefined') {
                try {
                    viewer = pannellum.viewer('panorama-view', {
                        "type": "equirectangular",
                        "panorama": sceneImage,
